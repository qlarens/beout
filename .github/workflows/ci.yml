name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      # bot.py/settings.py need BOT_TOKEN at import, so only env-free modules are imported
      - name: Import modules
        run: python -c "import auth, ride_stats, storage"
