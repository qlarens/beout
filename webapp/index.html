<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Be. Out!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  @font-face { font-family: "Inter"; font-display: swap;
    src: url("/assets/fonts/Inter-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter Display"; font-weight: 700; font-display: swap;
    src: url("/assets/fonts/InterDisplay-Bold.woff2") format("woff2"); }

  /* Светлая тема Telegram + фирменный акцент; в тёмной — фирменный фон. */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #0E1116);
    --hint: var(--tg-theme-hint-color, #6B7280);
    --card: var(--tg-theme-secondary-bg-color, #F1F2F4);
    --accent: #C6F432;
    --on-accent: #0E1116;
    --ink: #4D6B00; /* акцентный текст: салатовый на белом не читается */
    --danger: #E5484D;
  }
  [data-theme="dark"] {
    --bg: #0E1116; --text: #FFFFFF; --hint: #B7BDC7; --card: #1A1F27; --ink: #C6F432;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 88px;
    background: var(--bg); color: var(--text);
    font: 15px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1, h2, .num { font-family: "Inter Display", "Inter", system-ui, sans-serif; font-weight: 700; }
  h1 { font-size: 26px; margin: 4px 0 16px; }
  h2 { font-size: 18px; margin: 24px 0 10px; }
  .hint { color: var(--hint); font-size: 13px; }
  .hidden { display: none !important; }
  .i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
       stroke-linecap: round; stroke-linejoin: round; flex: none; }

  button {
    font: inherit; border: 0; border-radius: 12px; min-height: 44px; padding: 10px 16px;
    background: var(--card); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.wide { width: 100%; }
  button.danger { color: var(--danger); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--card); border-radius: 14px; padding: 12px; }
  .tile b { display: block; font: 700 20px/1.2 "Inter Display", "Inter", sans-serif; }
  .tile span { color: var(--hint); font-size: 12px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; }
  .chips button { flex: 1; min-width: 0; padding: 8px 6px; gap: 6px; font-size: 13px; }
  .chips.wrap { flex-wrap: wrap; }
  .chips.wrap button { flex: 1 1 40%; }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

  .row {
    background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px;
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; justify-content: flex-start;
  }
  .row .grow { flex: 1; min-width: 0; }
  .row .meta { display: block; color: var(--hint); font-size: 13px; }
  .row .km { font: 700 20px "Inter Display", "Inter", sans-serif; white-space: nowrap; }
  .badge {
    display: inline-block; background: var(--danger); color: #fff; border-radius: 6px;
    padding: 1px 6px; font-size: 11px; margin-left: 6px; vertical-align: middle;
  }
  .badge.live { animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .badge.live { animation: none; } }

  /* Экран тренировки: цифры читаются на ходу. */
  .big { text-align: center; margin: 8px 0 16px; }
  .big .num { font-size: 72px; line-height: 1; letter-spacing: -1px; }
  .big .pair { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; }
  .big .pair .num { font-size: 44px; }
  .big .label { color: var(--hint); font-size: 14px; margin-top: 4px; }

  #map, .map { height: 46vh; border-radius: 14px; margin-bottom: 12px; background: var(--card); }
  .swatch { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--on-accent); flex: none; }
  #map.small { height: 30vh; }
  [data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }

  .split { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 14px; }
  .split .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--card); overflow: hidden; }
  .split .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .split .km { width: 44px; color: var(--hint); }
  .split .t { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }

  .steps { list-style: none; padding: 0; margin: 12px 0; }
  .steps li { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .steps .i { width: 40px; height: 40px; padding: 8px; border-radius: 12px; background: var(--accent); color: var(--on-accent); }

  .weight-row { display: flex; gap: 8px; align-items: center; }
  .weight-row input {
    width: 96px; min-height: 44px; padding: 8px 10px; font: inherit;
    border: 1px solid var(--hint); border-radius: 12px; background: var(--bg); color: var(--text);
  }
  a { color: var(--ink); }
  .error { color: var(--danger); margin: 12px 0; }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; z-index: 500;
    background: var(--bg); border-top: 1px solid var(--card);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav button { flex: 1; flex-direction: column; gap: 2px; background: none; color: var(--hint); font-size: 11px; padding: 4px; }
  nav button[aria-current="page"] { color: var(--ink); }

  button.sos { background: var(--danger); color: #fff; font-weight: 700; min-height: 56px; margin-bottom: 12px; }
  .rec-row button { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .record { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; margin: -8px 0 12px; }
  .rec-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--card); }
  .rec-row b { font-family: "Inter Display", "Inter", sans-serif; }

  .sheet { position: fixed; inset: 0; background: var(--bg); padding: 24px 16px; overflow: auto; z-index: 1000; }
</style>
</head>
<body>

<section id="home" data-tab>
  <h1>Be. Out!</h1>
  <div id="active-card"></div>
  <div class="chips" id="home-kinds" role="group" data-t-aria="kind_group"></div>
  <button class="primary wide" id="start" data-t="start"></button>
  <p></p>
  <button class="wide" id="together"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-5.5 6.5-5.5s6.5 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.6 0 4.5 1.4 4.5 4.5"/></svg><span></span></button>
  <h2 data-t="last_ride"></h2>
  <div id="last-ride"></div>
  <p class="hint" id="streak"></p>
  <h2 data-t="this_week"></h2>
  <div id="week"></div>
  <h2 data-t="this_month"></h2>
  <div id="month"></div>
</section>

<section id="history" data-tab class="hidden">
  <h1 data-t="history"></h1>
  <div class="chips" id="history-kinds" role="group" data-t-aria="filter_group"></div>
  <div id="rides"></div>
  <button class="wide hidden" id="more" data-t="more"></button>
</section>

<section id="profile" data-tab class="hidden">
  <h1 data-t="profile"></h1>
  <h2 data-t="weight"></h2>
  <div class="weight-row">
    <label for="weight" class="hint" data-t="kg"></label>
    <input id="weight" type="number" inputmode="decimal" min="30" max="250" step="0.5">
    <button id="save-weight" data-t="save"></button>
  </div>
  <p class="hint" data-t="weight_hint"></p>
  <h2 data-t="language"></h2>
  <div class="chips wrap" id="profile-lang" role="group" data-t-aria="language"></div>
  <h2 data-t="default_kind"></h2>
  <div class="chips" id="profile-kinds" role="group" data-t-aria="default_kind"></div>
  <h2 data-t="records"></h2>
  <div id="records"></div>
  <h2 data-t="sos_title"></h2>
  <p class="hint" data-t="sos_hint"></p>
  <div id="sos-contacts"></div>
  <p></p>
  <button class="wide" id="sos-invite" data-t="sos_invite"></button>
  <h2 data-t="my_data"></h2>
  <p class="hint"><span data-t="data_hint"></span><br>
    <a href="/privacy" id="privacy-link" data-t="privacy_link"></a></p>
</section>

<section id="ride" class="hidden">
  <div class="chips" id="ride-kinds" role="group" data-t-aria="kind_group"></div>
  <h1 id="ride-title"></h1>
  <div id="ride-records"></div>
  <div id="ride-live"></div>
  <button class="wide sos hidden" id="sos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.01"/></svg><span data-t="sos_button"></span></button>
  <div id="map"></div>
  <div class="grid" id="ride-stats"></div>
  <div id="ride-actions" class="hidden">
    <p></p>
    <button class="primary wide" id="share"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v7h16v-7M12 3v12M7 8l5-5 5 5"/></svg><span data-t="share"></span></button>
    <p></p>
    <button class="wide" id="story"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><circle cx="10" cy="8.5" r="1.5"/><path d="m19 15-4.5-4.5L5 20"/></svg><span data-t="story"></span></button>
  </div>
  <div id="splits"></div>
  <p class="hint" id="ride-hint"></p>
  <button class="wide danger hidden" id="delete"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span data-t="delete_ride"></span></button>
</section>

<section id="session" class="hidden">
  <h1 data-t="together"></h1>
  <p class="hint" data-t="session_hint"></p>
  <div id="session-map" class="map"></div>
  <div id="session-people"></div>
  <p></p>
  <button class="wide" id="invite" data-t="invite_more"></button>
  <p></p>
  <button class="wide danger" id="leave"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span data-t="leave"></span></button>
</section>

<div class="error hidden" id="error" role="alert"></div>

<nav id="tabs">
  <button data-go="home" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v12h13V9"/></svg><span data-t="tab_home"></span></button>
  <button data-go="history"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span data-t="history"></span></button>
  <button data-go="profile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span data-t="profile"></span></button>
</nav>

<div class="sheet hidden" id="onboarding" role="dialog" aria-labelledby="onb-title">
  <h1 id="onb-title" data-t="onb_title"></h1>
  <p class="hint" data-t="onb_hint"></p>
  <ol class="steps" id="onb-steps"></ol>
  <button class="primary wide" id="onb-go" data-t="onb_go"></button>
  <p></p>
  <button class="wide" id="onb-close" data-t="onb_ok"></button>
</div>

function applyLang() {

  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });

function setLang(next) {

}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  return `${n} ${m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many}`;

function applyTheme() {
  const dark = tg ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (!tg) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  tg.setHeaderColor(bg);
  tg.setBackgroundColor(bg);
  tg.MainButton.setParams({ color: "#C6F432", text_color: "#0E1116" });
}
if (tg) { tg.ready(); tg.expand(); tg.onEvent("themeChanged", applyTheme); }

// ---------- API ----------
async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json", "X-Init-Data": (tg && tg.initData) || "", "X-Lang": lang,
      ...(options.headers || {}),
    },
  });
  if (!res.ok) throw new Error((await res.text()) || t("error_status", res.status));
  return res.json();
}
function showError(err) {
  $("error").textContent = err.message || String(err);
  $("error").classList.remove("hidden");
}
const haptic = (type) => tg && tg.HapticFeedback.notificationOccurred(type);
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });

// ---------- форматирование ----------
function fmtDuration(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  const pad = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
function fmtDate(ts) {
  return new Date(ts * 1000).toLocaleString(t("locale"), { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}
const tile = (value, label) => `<div class="tile"><b>${value}</b><span>${label}</span></div>`;
const speedOf = (r) => `${r.avg_speed_kmh} ${t("kmh")}`;

function kindChips(el, selected, onPick, all) {
  const options = all ? { "": t("all"), ...kinds() } : kinds();
  el.innerHTML = Object.entries(options).map(([k, title]) =>
    `<button data-kind="${k}" aria-pressed="${k === selected}">${k ? icon(k) : ""}${title}</button>`).join("");
  el.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || b.getAttribute("aria-pressed") === "true") return;
    if (tg) tg.HapticFeedback.selectionChanged();
    onPick(b.dataset.kind).catch(showError);
  };
}

// ---------- навигация ----------
let current = "home";
function show(id) {
  current = id;
  stopRefresh();
  setFinish(null);
  document.querySelectorAll("section").forEach((s) => s.classList.toggle("hidden", s.id !== id));
  const tab = $(id).hasAttribute("data-tab");
  $("tabs").classList.toggle("hidden", !tab);
  document.querySelectorAll("nav button").forEach((b) =>
    b.dataset.go === id ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (tg) tab ? tg.BackButton.hide() : tg.BackButton.show();
  $("error").classList.add("hidden");
  window.scrollTo(0, 0);
}
const SCREENS = { home: showHome, history: showHistory, profile: showProfile };
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) SCREENS[b.dataset.go]().catch(showError);
});
if (tg) tg.BackButton.onClick(() => showHome().catch(showError));

let me = null; // вес, тип по умолчанию, первая страница тренировок
async function loadMe() { me = await api("/api/rides"); setLang(me.lang); return me; }

function rideRow(r) {
  return `<button class="row" data-id="${r.id}">${icon(r.kind)}
    <span class="grow"><b>${fmtDate(r.started_at)}</b>${r.active ? '<span class="badge live">LIVE</span>' : ""}
      <span class="meta">${kinds()[r.kind]} · ${fmtDuration(r.moving_s)} · ${speedOf(r)}</span></span>
    <span class="km">${r.distance_km} ${t("km")}</span></button>`;
}
document.addEventListener("click", (e) => {
  const row = e.target.closest(".row[data-id]");
  if (row) showRide(row.dataset.id).catch(showError);
});

const pickDefaultKind = (then) => async (kind) => { await post("/api/kind", { kind }); await then(); };

// Итоги недели/месяца по времени телефона: сервер не знает часовой пояс.
const summary = () => api(`/api/summary?tz=${new Date().getTimezoneOffset()}`);

function periodHtml(totals) {
  const names = kinds(), used = Object.keys(names).filter((k) => totals[k]);
  return used.length ? used.map((k) => `<div class="row">${icon(k)}
    <span class="grow">${names[k]}<span class="meta">${t("workouts", totals[k].count)} · ${fmtDuration(totals[k].moving_s)}</span></span>
    <span class="km">${totals[k].distance_km} ${t("km")}</span></div>`).join("") : `<p class="hint">${t("nothing_yet")}</p>`;
}

async function showHome() {
  show("home");
  const [, sum] = await Promise.all([loadMe(), summary()]);
  const last = me.rides[0];
  $("active-card").innerHTML = last && last.active ? rideRow(last) : "";
  $("last-ride").innerHTML = !last ? `<p class="hint">${t("empty_home")}</p>` : last.active ? "" : rideRow(last);
  kindChips($("home-kinds"), me.kind, pickDefaultKind(showHome));
  $("together").lastChild.textContent = t(me.session_id ? "together_open" : "together");
  $("streak").textContent = sum.streak_days || sum.streak_weeks ? t("streak", sum.streak_days, sum.streak_weeks) : "";
  $("week").innerHTML = periodHtml(sum.week);
  $("month").innerHTML = periodHtml(sum.month);
}

// ---------- история ----------
let lastStartedAt = null, historyKind = "";
const ridesUrl = (before) => `/api/rides?${new URLSearchParams({ ...(historyKind && { kind: historyKind }), ...(before && { before }) })}`;
function appendRides(data, reset) {
  const html = data.rides.map(rideRow).join("");
  if (reset) $("rides").innerHTML = html || `<p class="hint">${t("no_rides")}</p>`;
  else $("rides").insertAdjacentHTML("beforeend", html);
  if (data.rides.length) lastStartedAt = data.rides[data.rides.length - 1].started_at;
  $("more").classList.toggle("hidden", !data.has_more);
}
async function showHistory() {
  show("history");
  kindChips($("history-kinds"), historyKind, async (kind) => { historyKind = kind; await showHistory(); }, true);
  appendRides(await api(ridesUrl()), true);
}
$("more").addEventListener("click", async () => {
  try { appendRides(await api(ridesUrl(lastStartedAt)), false); } catch (e) { showError(e); }
});

// ---------- тренировка: идёт — крупные цифры, завершена — итоги ----------
let map = null, routeLayer = null, refreshTimer = null;
function makeMap(id) {
  const m = L.map(id, { zoomControl: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(m);
  return [m, L.layerGroup().addTo(m)];
}
// Тёмная подложка: салатовая и белая линии читаются и на светлой карте.
function drawLine(layer, latlngs, color) {
  L.polyline(latlngs, { color: "#0E1116", weight: 8, opacity: 0.5 }).addTo(layer);
  L.polyline(latlngs, { color, weight: 5 }).addTo(layer);
}
const dot = (layer, ll, fill, label, permanent) => L.circleMarker(ll, { radius: 7, color: "#0E1116", fillColor: fill, fillOpacity: 1, weight: 2 })
  .bindTooltip(label, { permanent }).addTo(layer);

async function showRide(id) {
  show("ride");
  if (!map) [map, routeLayer] = makeMap("map");
  await renderRide(id, true);
  refreshTimer = setInterval(() => renderRide(id, false).catch(showError), 15000);
}

async function renderRide(id, fitView) {
  const { ride, points } = await api(`/api/rides/${id}`);
  if (current !== "ride") return; // пока ждали ответ, ушли с экрана
  setFinish(ride);
  kindChips($("ride-kinds"), ride.kind, async (kind) => {
    await post(`/api/rides/${id}/kind`, { kind });
    await renderRide(id, false);
  });
  $("ride-title").innerHTML = fmtDate(ride.started_at) + (ride.active ? '<span class="badge live">LIVE</span>' : "");
  const fast = [`${ride.avg_speed_kmh}`, t("avg_kmh"), `${ride.max_speed_kmh}`, t("max_kmh")];

  $("map").classList.toggle("small", ride.active);
  $("ride-live").innerHTML = ride.active ? `<div class="big">
      <div class="num">${fmtDuration(ride.moving_s)}</div><div class="label">${t("moving")}</div>
      <div class="pair"><div><div class="num">${ride.distance_km}</div><div class="label">${t("km")}</div></div>
        <div><div class="num">${fast[0]}</div><div class="label">${fast[1]}</div></div></div></div>` : "";
  $("ride-actions").classList.toggle("hidden", ride.active);
  $("sos").classList.toggle("hidden", !ride.active);
  $("delete").classList.toggle("hidden", ride.active);
  shareRideId = ride.id;
  $("ride-records").innerHTML = ride.records.map((key) =>
    `<div class="record">${icon("trophy")}${t("new_record", t(`rec_${key}`))}</div>`).join("");
  if (fitView && ride.records.length) haptic("success");
  $("ride-stats").innerHTML = ride.active ? "" :
    tile(ride.distance_km, t("km")) + tile(fmtDuration(ride.moving_s), t("moving")) + tile(fmtDuration(ride.duration_s), t("total")) +
    tile(fast[0], fast[1]) + tile(fast[2], fast[3]) + tile(`≈ ${ride.kcal}`, t("kcal")) +
    (ride.elevation_gain_m != null ? tile(ride.elevation_gain_m, t("elevation")) : "");

  const best = Math.min(...ride.splits);
  $("splits").innerHTML = ride.kind !== "ride" && ride.splits.length ? `<h2>${t("splits")}</h2>` + ride.splits.map((s, i) =>
    `<div class="split"><span class="km">${i + 1} ${t("km")}</span><span class="bar"><i style="width:${Math.round(best / s * 100)}%"></i></span>
      <span class="t">${fmtDuration(s)}</span></div>`).join("") : "";
  $("ride-hint").textContent = ride.active ? t("live_hint") : t("points", points.length);

  map.invalidateSize(); // карта была в скрытом блоке или поменяла высоту
  routeLayer.clearLayers();
  if (!points.length) { map.setView([52.23, 21.01], 12); return; }
  const latlngs = points.map((p) => [p[0], p[1]]);
  drawLine(routeLayer, latlngs, "#C6F432");
  dot(routeLayer, latlngs[0], "#FFFFFF", t("start_dot"));
  dot(routeLayer, latlngs[latlngs.length - 1], "#C6F432", t(ride.active ? "now" : "finish"));
  if (fitView) latlngs.length > 1 ? map.fitBounds(latlngs, { padding: [24, 24] }) : map.setView(latlngs[0], 15);
}

// ---------- совместная тренировка: одна карта на всех участников ----------
const esc = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`); // имена приходят из Telegram
const COLORS = ["#FFFFFF", "#5EC8FF", "#FF8A5B", "#B98CFF", "#FFD23F"]; // ты — всегда салатовый
let sessionMap = null, sessionLayer = null, sessionLink = null;

async function showSession(id) {
  show("session");
  sessionId = id;
  if (!sessionMap) [sessionMap, sessionLayer] = makeMap("session-map");
  await renderSession(id, true);
  refreshTimer = setInterval(() => renderSession(id, false).catch(showError), 15000);
}

async function renderSession(id, fitView) {
  const data = await api(`/api/sessions/${id}`);
  if (current !== "session") return;
  sessionLink = data.link;
  let other = 0;
  const people = data.participants.map((p) => ({ ...p, color: p.you ? "#C6F432" : COLORS[other++ % COLORS.length] }));
  const total = people.reduce((sum, p) => sum + (p.ride ? p.ride.distance_km : 0), 0);
  $("session-people").innerHTML = `<h2>${t("together_total", total.toFixed(2))}</h2>` + people.map((p) => `<div class="row">
      <span class="swatch" style="background:${p.color}"></span>
      <span class="grow">${esc(p.name)}${p.you ? t("you") : ""}${p.ride && p.ride.active ? '<span class="badge live">LIVE</span>' : ""}
        <span class="meta">${p.ride ? `${kinds()[p.ride.kind]} · ${fmtDuration(p.ride.moving_s)} · ${speedOf(p.ride)}` : t("not_started")}</span></span>
      <span class="km">${p.ride ? p.ride.distance_km : 0} ${t("km")}</span></div>`).join("");

  sessionMap.invalidateSize();
  sessionLayer.clearLayers();
  const all = [];
  for (const p of people.filter((p) => p.points.length)) {
    drawLine(sessionLayer, p.points, p.color);
    dot(sessionLayer, p.points[p.points.length - 1], p.color, esc(p.name), true);
    all.push(...p.points);
  }
  if (!all.length) sessionMap.setView([52.23, 21.01], 12);
  else if (fitView) all.length > 1 ? sessionMap.fitBounds(all, { padding: [32, 32] }) : sessionMap.setView(all[0], 15);
}

function invite() {
  const text = t("invite_text");
  const url = `https://t.me/share/url?url=${encodeURIComponent(sessionLink)}&text=${encodeURIComponent(text)}`;
  tg ? tg.openTelegramLink(url) : window.open(url);
}
$("invite").addEventListener("click", invite);
let sessionId = null;
$("leave").addEventListener("click", async () => {
  if (!(await confirmDialog(t("confirm_leave")))) return;
  try {
    await post(`/api/sessions/${sessionId}/leave`);
    haptic("warning");
    await showHome();
  } catch (e) { showError(e); }
});
$("together").addEventListener("click", async () => {
  try {
    if (tg) tg.HapticFeedback.impactOccurred("medium");
    const s = me.session_id ? { id: me.session_id } : await post("/api/sessions");
    await showSession(s.id);
    if (!me.session_id) invite();
  } catch (e) { showError(e); }
});

// Карточка приходит в чат с ботом; где Telegram умеет (Bot API 8.0+), сразу открывается выбор чата.
let shareRideId = null;
$("share").addEventListener("click", async () => {
  if (tg) tg.HapticFeedback.impactOccurred("light");
  $("share").disabled = true;
  try {
    const { prepared_id } = await post(`/api/rides/${shareRideId}/share`);
    if (prepared_id && tg && tg.isVersionAtLeast("8.0")) tg.shareMessage(prepared_id, (sent) => sent && haptic("success"));
    else if (tg) tg.showAlert(t("card_in_chat"));
  } catch (e) { showError(e); }
  $("share").disabled = false;
});
// Instagram не принимает картинки из Mini App напрямую: карточка приходит в чат, оттуда — в галерею.
$("story").addEventListener("click", async () => {
  if (tg) tg.HapticFeedback.impactOccurred("light");
  $("story").disabled = true;
  try {
    await post(`/api/rides/${shareRideId}/story?tz=${new Date().getTimezoneOffset()}`);
    haptic("success");
    const text = t("story_in_chat");
    tg ? tg.showAlert(text) : alert(text);
  } catch (e) { showError(e); }
  $("story").disabled = false;
});

$("delete").addEventListener("click", async () => {
  if (!(await confirmDialog(t("confirm_delete_ride")))) return;
  try {
    await api(`/api/rides/${shareRideId}`, { method: "DELETE" });
    haptic("warning");
    await showHistory();
  } catch (e) { showError(e); }
});

function stopRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

// «Финиш» — нативная кнопка Telegram внизу экрана: крупная, под большой палец.
let finishRideId = null;
function setFinish(ride) {
  finishRideId = ride && ride.active ? ride.id : null;
  if (!tg) return;
  if (finishRideId) tg.MainButton.setText(t("finish")).show(); else tg.MainButton.hide();
}
if (tg) tg.MainButton.onClick(() => {
  const id = finishRideId;
  tg.showConfirm(t("confirm_finish"), async (ok) => {
    if (!ok || !id) return;
    try {
      await post(`/api/rides/${id}/finish`);
      haptic("success");
      await renderRide(id, true);
      // Бот не может выключить трансляцию пользователя — только напомнить.
      tg.showAlert(t("finished_live"));
    } catch (e) { showError(e); }
  });
});

// ---------- старт: ?ride=ID — сразу эта тренировка; идущая открывается сама ----------
applyLang();
(async () => {
  const rideParam = new URLSearchParams(location.search).get("ride");
  if (rideParam) return showRide(rideParam);
  // Приглашение в совместную тренировку: t.me/<bot>?startapp=session_<token>.
  const start = tg && tg.initDataUnsafe.start_param;
  if (start && start.startsWith("session_")) {
    await loadMe();
    return showSession((await post(`/api/sessions/join/${encodeURIComponent(start.slice(8))}`)).id);
  }
  await showHome();
  if (me.rides[0] && me.rides[0].active) return showRide(me.rides[0].id);
  if (!localStorage.getItem("onboarded") && !me.rides.length) onboarding(true);
})().catch(showError);
</script>
