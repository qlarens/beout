<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Be. Out!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  @font-face { font-family: "Inter"; font-display: swap;
    src: url("/assets/fonts/Inter-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter Display"; font-weight: 700; font-display: swap;
    src: url("/assets/fonts/InterDisplay-Bold.woff2") format("woff2"); }

  /* Светлая тема Telegram + фирменный акцент; в тёмной — фирменный фон. */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #0E1116);
    --hint: var(--tg-theme-hint-color, #6B7280);
    --card: var(--tg-theme-secondary-bg-color, #F1F2F4);
    --accent: #C6F432;
    --on-accent: #0E1116;
    --ink: #4D6B00; /* акцентный текст: салатовый на белом не читается */
    --danger: #E5484D;
    --bar: #4D6B00; /* столбики графиков: салатовый на белом почти не виден */
  }
  [data-theme="dark"] {
    --bg: #0E1116; --text: #FFFFFF; --hint: #B7BDC7; --card: #1A1F27; --ink: #C6F432; --bar: #C6F432;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 16px 88px;
    background: var(--bg); color: var(--text);
    font: 15px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1, h2, .num { font-family: "Inter Display", "Inter", system-ui, sans-serif; font-weight: 700; }
  h1 { font-size: 26px; margin: 4px 0 16px; }
  h2 { font-size: 18px; margin: 24px 0 10px; }
  .hint { color: var(--hint); font-size: 13px; }
  .hidden { display: none !important; }
  .i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
       stroke-linecap: round; stroke-linejoin: round; flex: none; }

  button {
    font: inherit; border: 0; border-radius: 12px; min-height: 44px; padding: 10px 16px;
    background: var(--card); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  button.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.wide { width: 100%; }
  button.danger { color: var(--danger); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--card); border-radius: 14px; padding: 12px; }
  .tile b { display: block; font: 700 20px/1.2 "Inter Display", "Inter", sans-serif; }
  .tile span { color: var(--hint); font-size: 12px; }

  /* Кнопки-переключатели: равной ширины, текст не выходит за край (в крайнем случае — многоточие). */
  .chips { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 12px; }
  .chips button { min-width: 0; padding: 8px 6px; gap: 6px; font-size: 13px; }
  .chips button > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chips.kinds button { flex-direction: column; gap: 2px; min-height: 58px; padding: 8px 4px; font-size: 12px; }
  .chips.wrap { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .chips button:disabled { opacity: .4; cursor: default; }

  .row {
    background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px;
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; justify-content: flex-start;
  }
  .row .grow { flex: 1; min-width: 0; }
  .row .meta { display: block; color: var(--hint); font-size: 13px; }
  .row .km { font: 700 20px "Inter Display", "Inter", sans-serif; white-space: nowrap; }
  .badge {
    display: inline-block; background: var(--danger); color: #fff; border-radius: 6px;
    padding: 1px 6px; font-size: 11px; margin-left: 6px; vertical-align: middle;
  }
  .badge.live { animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .badge.live { animation: none; } }

  /* Экран тренировки: цифры читаются на ходу. */
  .big { text-align: center; margin: 8px 0 16px; }
  .big .num { font-size: 72px; line-height: 1; letter-spacing: -1px; }
  .big .pair { display: grid; grid-template-columns: 1fr 1fr; margin-top: 16px; }
  .big .pair .num { font-size: 44px; }
  .big .label { color: var(--hint); font-size: 14px; margin-top: 4px; }

  #map, .map { height: 46vh; border-radius: 14px; margin-bottom: 12px; background: var(--card); }
  .swatch { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--on-accent); flex: none; }
  #map.small { height: 30vh; }
  [data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }

  .split { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 14px; }
  .split .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--card); overflow: hidden; }
  .split .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .split .km { width: 44px; color: var(--hint); }
  .split .t { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }

  .steps { list-style: none; padding: 0; margin: 12px 0; }
  .steps li { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .steps .i { width: 40px; height: 40px; padding: 8px; border-radius: 12px; background: var(--accent); color: var(--on-accent); }

  .weight-row { display: flex; gap: 8px; align-items: center; }
  .weight-row input {
    width: 96px; min-height: 44px; padding: 8px 10px; font: inherit;
    border: 1px solid var(--hint); border-radius: 12px; background: var(--bg); color: var(--text);
  }
  a { color: var(--ink); }
  .error { color: var(--danger); margin: 12px 0; }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; z-index: 500;
    background: var(--bg); border-top: 1px solid var(--card);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  nav button { flex: 1; flex-direction: column; gap: 2px; background: none; color: var(--hint); font-size: 11px; padding: 4px; }
  nav button[aria-current="page"] { color: var(--ink); }

  button.sos { background: var(--danger); color: #fff; font-weight: 700; min-height: 56px; margin-bottom: 12px; }
  .rec-row button { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .record { display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; margin: -8px 0 12px; }
  .rec-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--card); }
  .rec-row b { font-family: "Inter Display", "Inter", sans-serif; }

  .sheet { position: fixed; inset: 0; background: var(--bg); padding: 24px 16px; overflow: auto; z-index: 1000; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet-head h1 { margin: 0; }
  .sheet-head button { min-width: 44px; padding: 10px; }

  /* Карточка: превью сверху, настройки ниже. */
  .preview { position: relative; display: flex; justify-content: center; margin: 16px 0 4px; }
  .preview img { display: block; max-width: 100%; max-height: 52vh; border-radius: 14px; background: var(--card);
                 box-shadow: 0 0 0 1px var(--card); /* тёмная карточка не сливается с тёмным фоном */
                 aspect-ratio: 4 / 5; object-fit: contain; transition: opacity .15s; }
  .preview.story img { aspect-ratio: 9 / 16; }
  .preview.loading img { opacity: .55; }
  .photo-row { display: flex; gap: 8px; align-items: center; }
  .photo-row img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; }
  .photo-row button:first-of-type { flex: 1; }
  .card-actions { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 calc(4px + env(safe-area-inset-bottom)); }
  .card-actions button + button { margin-top: 8px; }

  /* Админ: плитки, графики-столбики, строки со шкалой. Столбики — один цвет: в светлой теме тёмный акцент. */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: var(--card); border-radius: 14px; padding: 12px; min-width: 0; }
  .kpi b { display: block; font: 700 26px/1.15 "Inter Display", "Inter", sans-serif; }
  .kpi span { display: block; color: var(--hint); font-size: 12px; }
  .kpi .up { color: var(--ink); } .kpi .down { color: var(--danger); }
  .chart { background: var(--card); border-radius: 14px; padding: 12px 12px 8px; margin-bottom: 8px; }
  .chart-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 8px; }
  .chart-head span:last-child { color: var(--hint); font-variant-numeric: tabular-nums; text-align: right; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 72px; }
  .bars button { flex: 1; min-width: 0; min-height: 0; height: 100%; padding: 0; border-radius: 0; background: none;
                 display: flex; align-items: flex-end; }
  .bars i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--bar); min-height: 2px; }
  .bars button[aria-pressed="true"] i { background: var(--text); }
  .bars i.zero { background: var(--hint); opacity: .25; }
  .axis { display: flex; justify-content: space-between; color: var(--hint); font-size: 11px; margin-top: 4px; }
  .meter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; margin-bottom: 10px; font-size: 14px; }
  .meter .bar { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--card); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
  .meter b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .meter > span:first-child { min-width: 0; }
  .meter b { white-space: nowrap; }
  .rec-row > span:first-child { min-width: 0; }
  .rec-row > span.hint:last-child, .rec-row > b:last-child { white-space: nowrap; margin-left: 12px; }
  details.leader { border-bottom: 1px solid var(--card); }
  details.leader summary { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center;
                           padding: 10px 0; cursor: pointer; list-style: none; }
  details.leader summary::-webkit-details-marker { display: none; }
  details.leader summary .rank { color: var(--hint); font-variant-numeric: tabular-nums; }
  details.leader summary .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.leader summary b { font: 700 18px "Inter Display", "Inter", sans-serif; }
  details.leader .sub { color: var(--hint); font-size: 12px; display: block; }
  details.leader ul { margin: 0 0 10px 36px; padding: 0; list-style: none; font-size: 14px; }
  details.leader li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  details.leader li span:last-child { color: var(--hint); font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>

<section id="home" data-tab>
  <h1>Be. Out!</h1>
  <div id="active-card"></div>
  <div class="chips kinds" id="home-kinds" role="group" data-t-aria="kind_group"></div>
  <button class="primary wide" id="start" data-t="start"></button>
  <p></p>
  <button class="wide" id="together"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-5.5 6.5-5.5s6.5 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.6 0 4.5 1.4 4.5 4.5"/></svg><span></span></button>
  <h2 data-t="last_ride"></h2>
  <div id="last-ride"></div>
  <p class="hint" id="streak"></p>
  <h2 data-t="this_week"></h2>
  <div id="week"></div>
  <h2 data-t="this_month"></h2>
  <div id="month"></div>
</section>

<section id="history" data-tab class="hidden">
  <h1 data-t="history"></h1>
  <div class="chips kinds" id="history-kinds" role="group" data-t-aria="filter_group"></div>
  <div id="rides"></div>
  <button class="wide hidden" id="more" data-t="more"></button>
</section>

<section id="profile" data-tab class="hidden">
  <h1 data-t="profile"></h1>
  <h2 data-t="weight"></h2>
  <div class="weight-row">
    <label for="weight" class="hint" data-t="kg"></label>
    <input id="weight" type="number" inputmode="decimal" min="30" max="250" step="0.5">
    <button id="save-weight" data-t="save"></button>
  </div>
  <p class="hint" data-t="weight_hint"></p>
  <h2 data-t="language"></h2>
  <div class="chips wrap" id="profile-lang" role="group" data-t-aria="language"></div>
  <h2 data-t="default_kind"></h2>
  <div class="chips kinds" id="profile-kinds" role="group" data-t-aria="default_kind"></div>
  <h2 data-t="records"></h2>
  <div id="records"></div>
  <h2 data-t="sos_title"></h2>
  <p class="hint" data-t="sos_hint"></p>
  <div id="sos-contacts"></div>
  <p></p>
  <button class="wide" id="sos-invite" data-t="sos_invite"></button>
  <h2><span data-t="ref_title"></span> <span class="hint" id="ref-count"></span></h2>
  <p class="hint" data-t="ref_hint"></p>
  <div id="ref-list"></div>
  <p></p>
  <button class="wide" id="ref-invite" data-t="ref_invite"></button>
  <h2 data-t="my_data"></h2>
  <p class="hint"><span data-t="data_hint"></span><br>
    <a href="/privacy" id="privacy-link" data-t="privacy_link"></a></p>
</section>

<section id="ride" class="hidden">
  <div class="chips kinds" id="ride-kinds" role="group" data-t-aria="kind_group"></div>
  <h1 id="ride-title"></h1>
  <div id="ride-records"></div>
  <div id="ride-live"></div>
  <button class="wide sos hidden" id="sos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.01"/></svg><span data-t="sos_button"></span></button>
  <div id="map"></div>
  <div class="grid" id="ride-stats"></div>
  <div id="ride-actions" class="hidden">
    <p></p>
    <button class="primary wide" id="share"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v7h16v-7M12 3v12M7 8l5-5 5 5"/></svg><span data-t="share"></span></button>
  </div>
  <div id="splits"></div>
  <p class="hint" id="ride-hint"></p>
  <button class="wide danger hidden" id="delete"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg><span data-t="delete_ride"></span></button>
</section>

<section id="session" class="hidden">
  <h1 data-t="together"></h1>
  <p class="hint" data-t="session_hint"></p>
  <div id="session-map" class="map"></div>
  <div id="session-people"></div>
  <p></p>
  <button class="wide" id="invite" data-t="invite_more"></button>
  <p></p>
  <button class="wide danger" id="leave"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span data-t="leave"></span></button>
</section>

<section id="admin" data-tab class="hidden">
  <h1 data-t="admin"></h1>
  <p class="hint" data-t="admin_hint"></p>
  <div id="admin-body"></div>
</section>

<div class="error hidden" id="error" role="alert"></div>

<nav id="tabs">
  <button data-go="home" aria-current="page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9v12h13V9"/></svg><span data-t="tab_home"></span></button>
  <button data-go="history"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span data-t="history"></span></button>
  <button data-go="profile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span data-t="profile"></span></button>
  <button data-go="admin" class="hidden" id="admin-tab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="admin"></span></button>
</nav>

<!-- Согласие прямо в Mini App: новичку — о данных, остальным — что условия обновились. -->
<div class="sheet hidden" id="consent" role="dialog" aria-labelledby="consent-title">
  <h1 id="consent-title"></h1>
  <p id="consent-text"></p>
  <p class="hint" data-t="consent_hint"></p>
  <button class="wide" id="consent-read"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></svg><span data-t="consent_read"></span></button>
  <p></p>
  <button class="primary wide" id="consent-accept" data-t="consent_accept"></button>
</div>

<!-- Карточка тренировки: формат, карта, фото, что показать; превью рисует сервер. -->
<div class="sheet hidden" id="card-sheet" role="dialog" aria-labelledby="card-title">
  <div class="sheet-head">
    <h1 id="card-title" data-t="card_title"></h1>
    <button id="card-close" data-t-aria="close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="preview" id="card-preview-box"><img id="card-preview" data-t-alt="card_preview"></div>
  <h2 data-t="card_format"></h2>
  <div class="chips" id="card-format" role="group" data-t-aria="card_format"></div>
  <h2 data-t="card_map"></h2>
  <div class="chips" id="card-panel" role="group" data-t-aria="card_map"></div>
  <h2 data-t="card_photo"></h2>
  <div class="photo-row">
    <img id="card-photo-thumb" class="hidden" alt="">
    <button id="card-photo-pick"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8.5 5 10 3h4l1.5 2"/></svg><span></span></button>
    <button id="card-photo-remove" class="danger hidden" data-t="remove"></button>
  </div>
  <p class="hint" data-t="card_photo_hint"></p>
  <input type="file" accept="image/*" id="card-photo-input" class="hidden">
  <p class="error hidden" id="card-error" role="alert"></p>
  <h2 data-t="card_show"></h2>
  <div class="chips wrap" id="card-fields" role="group" data-t-aria="card_show"></div>
  <div class="card-actions">
    <button class="primary wide" id="card-main"></button>
    <button class="wide" id="card-alt"></button>
  </div>
</div>

<div class="sheet hidden" id="onboarding" role="dialog" aria-labelledby="onb-title">
  <h1 id="onb-title" data-t="onb_title"></h1>
  <p class="hint" data-t="onb_hint"></p>
  <ol class="steps" id="onb-steps"></ol>
  <button class="primary wide" id="onb-go" data-t="onb_go"></button>
  <p></p>
  <button class="wide" id="onb-close" data-t="onb_ok"></button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const $ = (id) => document.getElementById(id);

// ---------- языки: ru, uk, en; язык без перевода — английский ----------
const LANGS = ["ru", "uk", "en"];
const pickLang = (code) => { const base = (code || "").split("-")[0].toLowerCase(); return LANGS.includes(base) ? base : "en"; };
// До ответа сервера — последний известный язык или язык Telegram; сервер ещё учитывает выбор в профиле.
let lang = localStorage.getItem("lang") || pickLang(tg && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code);
const slavic = (one, few, many) => (n) => plural(n, one, few, many);
const english = (one, many) => (n) => `${n} ${n === 1 ? one : many}`;
const I18N = {
  ru: {
    locale: "ru-RU", kind_ride: "Велосипед", kind_run: "Бег", kind_walk: "Ходьба", all: "Все",
    kind_group: "Тип тренировки", filter_group: "Фильтр по типу", default_kind: "Тип по умолчанию",
    start: "Начать тренировку", together: "Совместная тренировка", together_open: "Открыть совместную тренировку",
    last_ride: "Последняя тренировка", this_week: "Эта неделя", this_month: "Этот месяц",
    history: "История", more: "Показать ещё", profile: "Профиль", tab_home: "Главная",

function applyLang() {

}

function applyTheme() {
  const dark = tg ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (!tg) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  tg.setHeaderColor(bg);
  tg.setBackgroundColor(bg);
  tg.MainButton.setParams({ color: "#C6F432", text_color: "#0E1116" });
}

// ---------- API ----------
async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: {
      "Content-Type": "application/json", "X-Init-Data": (tg && tg.initData) || "", "X-Lang": lang,
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const err = new Error((await res.text()) || t("error_status", res.status));
    if (res.headers.get("X-Error") === "err_consent") { err.consent = true; showConsent(); }
    throw err;
  }
  return res.json();
}
function showError(err) {
  if (err.consent) return; // вместо ошибки — экран согласия
  $("error").textContent = err.message || String(err);
  $("error").classList.remove("hidden");
}
const haptic = (type) => tg && tg.HapticFeedback.notificationOccurred(type);
const post = (path, body) => api(path, { method: "POST", body: JSON.stringify(body || {}) });

// ---------- форматирование ----------
function fmtDuration(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  const pad = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
}
function fmtDate(ts) {
  return new Date(ts * 1000).toLocaleString(t("locale"), { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
}
const tile = (value, label) => `<div class="tile"><b>${value}</b><span>${label}</span></div>`;
const speedOf = (r) => `${r.avg_speed_kmh}\u00a0${t("kmh")}`;

function kindChips(el, selected, onPick, all) {
  const options = all ? { "": t("all"), ...kinds() } : kinds();
  el.innerHTML = Object.entries(options).map(([k, title]) =>
    `<button data-kind="${k}" aria-pressed="${k === selected}">${k ? icon(k) : ""}<span>${title}</span></button>`).join("");
  el.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || b.getAttribute("aria-pressed") === "true") return;
    if (tg) tg.HapticFeedback.selectionChanged();
    onPick(b.dataset.kind).catch(showError);
  };
}

let current = "home";
function show(id) {
  current = id;
  stopRefresh();
  setFinish(null);
  document.querySelectorAll("section").forEach((s) => s.classList.toggle("hidden", s.id !== id));
  const tab = $(id).hasAttribute("data-tab");
  $("tabs").classList.toggle("hidden", !tab);
  document.querySelectorAll("nav button").forEach((b) =>
    b.dataset.go === id ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (tg) tab ? tg.BackButton.hide() : tg.BackButton.show();
  $("error").classList.add("hidden");
  window.scrollTo(0, 0);
}
const SCREENS = { home: showHome, history: showHistory, profile: showProfile, admin: showAdmin };
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) SCREENS[b.dataset.go]().catch(showError);
});

let me = null; // вес, тип по умолчанию, первая страница тренировок
async function loadMe() {
  me = await api("/api/rides");
  setLang(me.lang);
  $("admin-tab").classList.toggle("hidden", !me.admin);
  return me;
}

function rideRow(r) {
  return `<button class="row" data-id="${r.id}">${icon(r.kind)}
    <span class="grow"><b>${fmtDate(r.started_at)}</b>${r.active ? '<span class="badge live">LIVE</span>' : ""}
      <span class="meta">${kinds()[r.kind]} · ${fmtDuration(r.moving_s)} · ${speedOf(r)}</span></span>
    <span class="km">${r.distance_km} ${t("km")}</span></button>`;
}
document.addEventListener("click", (e) => {
  const row = e.target.closest(".row[data-id]");
  if (row) showRide(row.dataset.id).catch(showError);
});

const pickDefaultKind = (then) => async (kind) => { await post("/api/kind", { kind }); await then(); };

// Итоги недели/месяца по времени телефона: сервер не знает часовой пояс.
const summary = () => api(`/api/summary?tz=${new Date().getTimezoneOffset()}`);

function periodHtml(totals) {
  const names = kinds(), used = Object.keys(names).filter((k) => totals[k]);
  return used.length ? used.map((k) => `<div class="row">${icon(k)}
    <span class="grow">${names[k]}<span class="meta">${t("workouts", totals[k].count)} · ${fmtDuration(totals[k].moving_s)}</span></span>
    <span class="km">${totals[k].distance_km} ${t("km")}</span></div>`).join("") : `<p class="hint">${t("nothing_yet")}</p>`;
}

async function showHome() {
  show("home");
  const [, sum] = await Promise.all([loadMe(), summary()]);
  const last = me.rides[0];
  $("active-card").innerHTML = last && last.active ? rideRow(last) : "";
  $("last-ride").innerHTML = !last ? `<p class="hint">${t("empty_home")}</p>` : last.active ? "" : rideRow(last);
  kindChips($("home-kinds"), me.kind, pickDefaultKind(showHome));
  $("together").lastChild.textContent = t(me.session_id ? "together_open" : "together");
  $("streak").textContent = sum.streak_days || sum.streak_weeks ? t("streak", sum.streak_days, sum.streak_weeks) : "";
  $("week").innerHTML = periodHtml(sum.week);
  $("month").innerHTML = periodHtml(sum.month);
}

let lastStartedAt = null, historyKind = "";

function appendRides(data, reset) {
  const html = data.rides.map(rideRow).join("");
  if (reset) $("rides").innerHTML = html || `<p class="hint">${t("no_rides")}</p>`;
  else $("rides").insertAdjacentHTML("beforeend", html);
  if (data.rides.length) lastStartedAt = data.rides[data.rides.length - 1].started_at;
  $("more").classList.toggle("hidden", !data.has_more);
}

  appendRides(await api(ridesUrl()), true);
}

// ---------- тренировка: идёт — крупные цифры, завершена — итоги ----------
let map = null, routeLayer = null, refreshTimer = null;
function makeMap(id) {
  const m = L.map(id, { zoomControl: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(m);
  return [m, L.layerGroup().addTo(m)];
}
// Тёмная подложка: салатовая и белая линии читаются и на светлой карте.
function drawLine(layer, latlngs, color) {
  L.polyline(latlngs, { color: "#0E1116", weight: 8, opacity: 0.5 }).addTo(layer);
  L.polyline(latlngs, { color, weight: 5 }).addTo(layer);
}
const dot = (layer, ll, fill, label, permanent) => L.circleMarker(ll, { radius: 7, color: "#0E1116", fillColor: fill, fillOpacity: 1, weight: 2 })
  .bindTooltip(label, { permanent }).addTo(layer);

async function showRide(id) {
  show("ride");
  if (!map) [map, routeLayer] = makeMap("map");
  await renderRide(id, true);
  refreshTimer = setInterval(() => renderRide(id, false).catch(showError), 15000);
}

async function renderRide(id, fitView) {
  const { ride, points } = await api(`/api/rides/${id}`);
  if (current !== "ride") return; // пока ждали ответ, ушли с экрана
  setFinish(ride);
  kindChips($("ride-kinds"), ride.kind, async (kind) => {
    await post(`/api/rides/${id}/kind`, { kind });
    await renderRide(id, false);
  });
  $("ride-title").innerHTML = fmtDate(ride.started_at) + (ride.active ? '<span class="badge live">LIVE</span>' : "");
  const fast = [`${ride.avg_speed_kmh}`, t("avg_kmh"), `${ride.max_speed_kmh}`, t("max_kmh")];

  $("map").classList.toggle("small", ride.active);
  $("ride-live").innerHTML = ride.active ? `<div class="big">
      <div class="num">${fmtDuration(ride.moving_s)}</div><div class="label">${t("moving")}</div>
      <div class="pair"><div><div class="num">${ride.distance_km}</div><div class="label">${t("km")}</div></div>
        <div><div class="num">${fast[0]}</div><div class="label">${fast[1]}</div></div></div></div>` : "";
  $("ride-actions").classList.toggle("hidden", ride.active);
  $("sos").classList.toggle("hidden", !ride.active);
  $("delete").classList.toggle("hidden", ride.active);
  shareRideId = ride.id;
  currentRide = ride;
  $("ride-records").innerHTML = ride.records.map((key) =>
    `<div class="record">${icon("trophy")}${t("new_record", t(`rec_${key}`))}</div>`).join("");
  if (fitView && ride.records.length) haptic("success");
  $("ride-stats").innerHTML = ride.active ? "" :
    tile(ride.distance_km, t("km")) + tile(fmtDuration(ride.moving_s), t("moving")) + tile(fmtDuration(ride.duration_s), t("total")) +
    tile(fast[0], fast[1]) + tile(fast[2], fast[3]) + tile(`≈ ${ride.kcal}`, t("kcal")) +
    (ride.elevation_gain_m != null ? tile(ride.elevation_gain_m, t("elevation")) : "");

  const best = Math.min(...ride.splits);
  $("splits").innerHTML = ride.kind !== "ride" && ride.splits.length ? `<h2>${t("splits")}</h2>` + ride.splits.map((s, i) =>
    `<div class="split"><span class="km">${i + 1} ${t("km")}</span><span class="bar"><i style="width:${Math.round(best / s * 100)}%"></i></span>
      <span class="t">${fmtDuration(s)}</span></div>`).join("") : "";
  $("ride-hint").textContent = ride.active ? t("live_hint") : t("points", points.length);

  map.invalidateSize(); // карта была в скрытом блоке или поменяла высоту
  routeLayer.clearLayers();
  if (!points.length) { map.setView([52.23, 21.01], 12); return; }
  const latlngs = points.map((p) => [p[0], p[1]]);
  drawLine(routeLayer, latlngs, "#C6F432");
  dot(routeLayer, latlngs[0], "#FFFFFF", t("start_dot"));
  dot(routeLayer, latlngs[latlngs.length - 1], "#C6F432", t(ride.active ? "now" : "finish"));
  if (fitView) latlngs.length > 1 ? map.fitBounds(latlngs, { padding: [24, 24] }) : map.setView(latlngs[0], 15);
}

// ---------- совместная тренировка: одна карта на всех участников ----------
const esc = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`); // имена приходят из Telegram
const COLORS = ["#FFFFFF", "#5EC8FF", "#FF8A5B", "#B98CFF", "#FFD23F"]; // ты — всегда салатовый
let sessionMap = null, sessionLayer = null, sessionLink = null;

async function showSession(id) {

  sessionId = id;

}

async function renderSession(id, fitView) {
  const data = await api(`/api/sessions/${id}`);
  if (current !== "session") return;
  sessionLink = data.link;
  let other = 0;
  const people = data.participants.map((p) => ({ ...p, color: p.you ? "#C6F432" : COLORS[other++ % COLORS.length] }));
  const total = people.reduce((sum, p) => sum + (p.ride ? p.ride.distance_km : 0), 0);
  $("session-people").innerHTML = `<h2>${t("together_total", total.toFixed(2))}</h2>` + people.map((p) => `<div class="row">
      <span class="swatch" style="background:${p.color}"></span>
      <span class="grow">${esc(p.name)}${p.you ? t("you") : ""}${p.ride && p.ride.active ? '<span class="badge live">LIVE</span>' : ""}
        <span class="meta">${p.ride ? `${kinds()[p.ride.kind]} · ${fmtDuration(p.ride.moving_s)} · ${speedOf(p.ride)}` : t("not_started")}</span></span>
      <span class="km">${p.ride ? p.ride.distance_km : 0} ${t("km")}</span></div>`).join("");

  sessionMap.invalidateSize();
  sessionLayer.clearLayers();
  const all = [];
  for (const p of people.filter((p) => p.points.length)) {
    drawLine(sessionLayer, p.points, p.color);
    dot(sessionLayer, p.points[p.points.length - 1], p.color, esc(p.name), true);
    all.push(...p.points);
  }
  if (!all.length) sessionMap.setView([52.23, 21.01], 12);
  else if (fitView) all.length > 1 ? sessionMap.fitBounds(all, { padding: [32, 32] }) : sessionMap.setView(all[0], 15);
}

function optionChips(el, options, isOn, onPick, isDisabled) {
  el.innerHTML = Object.entries(options).map(([k, title]) =>
    `<button data-k="${k}" aria-pressed="${isOn(k)}"${isDisabled && isDisabled(k) ? " disabled" : ""}><span>${title}</span></button>`).join("");
  el.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (tg) tg.HapticFeedback.selectionChanged();
    onPick(b.dataset.k);
    saveCardPrefs();
    renderCardControls();
    refreshPreview();
  };
}
function renderCardControls() {
  optionChips($("card-format"), { post: t("fmt_post"), story: t("fmt_story") }, (k) => k === card.format, (k) => { card.format = k; });
  optionChips($("card-panel"), { map: t("panel_map"), route: t("panel_route"), none: t("panel_none") },
    (k) => k === card.panel, (k) => { card.panel = k; });
  optionChips($("card-fields"), Object.fromEntries(CARD_FIELDS.map((f) => [f, t(`f_${f}`)])),
    (f) => card.fields.has(f) && fieldAvailable(f),
    (f) => { card.fields.has(f) ? card.fields.delete(f) : card.fields.add(f); }, (f) => !fieldAvailable(f));
  $("card-photo-pick").lastChild.textContent = t(card.photo ? "photo_change" : "photo_add");
  const story = card.format === "story";
  $("card-main").innerHTML = icon(story ? "download" : "send") + `<span>${t(story ? "card_save" : "card_send_chat")}</span>`;
  $("card-alt").innerHTML = icon(story ? "chat" : "download") + `<span>${t(story ? "card_to_bot" : "card_save")}</span>`;
}

function cardError(err) {
  $("card-error").textContent = err.message || String(err);
  $("card-error").classList.remove("hidden");
}
async function cardRequest(action, signal) {
  const form = new FormData();
  form.append("options", JSON.stringify({ format: card.format, panel: card.panel, fields: [...card.fields], action }));
  if (card.photo) form.append("photo", card.photo, "photo.jpg");
  const res = await fetch(`/api/rides/${card.ride.id}/card?tz=${new Date().getTimezoneOffset()}`, {
    method: "POST", body: form, signal, headers: { "X-Init-Data": (tg && tg.initData) || "", "X-Lang": lang },
  });
  if (!res.ok) throw new Error((await res.text()) || t("error_status", res.status));
  return res;
}
function refreshPreview() {
  const box = $("card-preview-box");
  box.classList.toggle("story", card.format === "story");
  box.classList.add("loading");
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    if (previewAbort) previewAbort.abort();
    previewAbort = new AbortController();
    try {
      const blob = await (await cardRequest("preview", previewAbort.signal)).blob();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(blob);
      $("card-preview").src = previewUrl;
      box.classList.remove("loading");
      $("card-error").classList.add("hidden");
    } catch (e) { if (e.name !== "AbortError") cardError(e); }
  }, 250);
}

// Фото уменьшаем на телефоне (до 1600 px, JPEG): быстрее доходит, а сервер его не хранит.
async function shrinkPhoto(file) {
  const img = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(() => null);
  if (!img) return file; // браузер не открыл — пусть попробует сервер
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(img.width * k);
  canvas.height = Math.round(img.height * k);
  canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
  return new Promise((ok) => canvas.toBlob((b) => ok(b || file), "image/jpeg", 0.86));
}
$("card-photo-pick").addEventListener("click", () => $("card-photo-input").click());
$("card-photo-input").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file || !card) return;
  card.photo = await shrinkPhoto(file);
  $("card-photo-thumb").src = URL.createObjectURL(card.photo);
  $("card-photo-thumb").classList.remove("hidden");
  $("card-photo-remove").classList.remove("hidden");
  renderCardControls();

});

});

// ---------- админ: видно только тем, чей ID в ADMIN_CHAT_ID (сервер проверяет сам) ----------
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const fmtNum = (n) => Number(n).toLocaleString(t("locale"));
function kpi(value, label, sub) {
  return `<div class="kpi"><b>${value}</b><span>${label}</span>${sub ? `<span>${sub}</span>` : ""}</div>`;
}
function vsPrev(now, prev) {
  const d = Math.round((now - prev) * 10) / 10;
  return d ? `<span class="${d > 0 ? "up" : "down"}">${t("a_vs", d)}</span>` : "";
}
const meter = (label, value, frac) =>
  `<div class="meter"><span>${label}</span><b>${value}</b><span class="bar"><i style="width:${Math.max(0, Math.min(100, frac * 100))}%"></i></span></div>`;
const shortDay = (ts) => new Date(ts * 1000).toLocaleDateString(t("locale"), { day: "numeric", month: "short" });

// Столбики по дням: один цвет, касание столбика показывает число за день.
function barChart(title, values, since, summary) {
  const max = Math.max(...values, 1);
  const days = values.map((_, i) => since + i * 86400 + 43200); // полдень: дата не съедет из-за перехода на летнее время
  const bars = values.map((v, i) => `<button data-label="${t("a_day", shortDay(days[i]), v)}" aria-label="${t("a_day", shortDay(days[i]), v)}">
    <i class="${v ? "" : "zero"}" style="height:${v ? Math.max(6, (v / max) * 100) : 3}%"></i></button>`).join("");
  return `<div class="chart"><div class="chart-head"><span>${title}</span><span data-default="${summary}">${summary}</span></div>
    <div class="bars">${bars}</div><div class="axis"><span>${shortDay(days[0])}</span><span>${shortDay(days[days.length - 1])}</span></div></div>`;
}
$("admin-body").addEventListener("click", (e) => {
  const b = e.target.closest(".bars button");
  if (!b) return;
  const chart = b.closest(".chart"), head = chart.querySelector(".chart-head span:last-child");
  const on = b.getAttribute("aria-pressed") !== "true";
  chart.querySelectorAll(".bars button").forEach((x) => x.removeAttribute("aria-pressed"));
  if (on) b.setAttribute("aria-pressed", "true");
  head.textContent = on ? b.dataset.label : head.dataset.default;
});

    ${meter(t("a_came_back"), `${t("a_of", a.retention.came_back, a.retention.cohort)} · ${pct(a.retention.came_back, a.retention.cohort)}%`,
      a.retention.cohort ? a.retention.came_back / a.retention.cohort : 0)}
    ${meter(t("a_both_weeks"), `${t("a_of", a.retention.both_weeks, a.retention.last_week)} · ${pct(a.retention.both_weeks, a.retention.last_week)}%`,
      a.retention.last_week ? a.retention.both_weeks / a.retention.last_week : 0)}
    <h2>${t("a_referrals")} · ${fmtNum(invited)}</h2>
    ${leaders.map((r, i) => `<details class="leader"><summary><span class="rank">${i + 1}</span>
        <span class="who">${esc(r.name)}<span class="sub">${t("a_ref_active", r.active, r.count)}</span></span><b>${r.count}</b></summary>
        <ul>${r.invited.map((x) => `<li><span>${esc(x.name)}</span><span>${fmtDate(x.at)}</span></li>`).join("")}</ul></details>`).join("")
      || `<p class="hint">${t("a_ref_empty")}</p>`}
    <h2>${t("a_kinds")}</h2>
    ${kindsUsed.map((k) => meter(names[k], `${t("workouts", a.kinds_30d[k].rides)} · ${a.kinds_30d[k].km} ${t("km")}`, a.kinds_30d[k].km / kmMax)).join("")
      || `<p class="hint">${t("nothing_yet")}</p>`}
    <h2>${t("a_features")}</h2>
    <div class="rec-row"><span>${t("a_cards")}<span class="meta hint" style="display:block">${t("a_cards_sub", sum(cards.slice(3)), n("card_photo"))}</span></span><b>${sum(cards)}</b></div>
    <div class="rec-row"><span>${t("a_sessions")}<span class="hint" style="display:block">${t("a_sessions_sub", f.sessions_together, f.joint_rides_30d)}</span></span><b>${f.sessions}</b></div>
    <div class="rec-row"><span>${t("a_sos")}<span class="hint" style="display:block">${t("a_sos_sub", f.sos_contacts)}</span></span><b>${f.sos_users}</b></div>
    <div class="rec-row"><span>${t("a_groups")}<span class="hint" style="display:block">${t("a_groups_sub", f.rating_members)}</span></span><b>${f.rating_groups}</b></div>
    <div class="rec-row"><span>${t("a_ref_links")}</span><b>${f.ref_links}</b></div>
    <div class="rec-row"><span>${t("a_weight")}</span><b>${f.weight_set}</b></div>
    <h2>${t("a_langs")}</h2>
    ${Object.entries(a.langs).sort((x, y) => y[1] - x[1]).map(([k, v]) =>
      meter(langs[k] || k, `${v} · ${pct(v, a.users)}%`, a.users ? v / a.users : 0)).join("")}
    <h2>${t("a_recent")}</h2>
    ${a.recent.map((u) => `<div class="rec-row"><span>${esc(u.name)}<span class="hint" style="display:block">
        ${u.joined_at ? fmtDate(u.joined_at) : ""} · ${u.invited_by ? t("a_by", esc(u.invited_by)) : t("a_self")}</span></span>
        <span class="hint">${t("workouts", u.rides)}</span></div>`).join("") || `<p class="hint">${t("nothing_yet")}</p>`}`;
}
async function showAdmin() {
  show("admin");
  const a = await api(`/api/admin?tz=${new Date().getTimezoneOffset()}`);
  if (current === "admin") $("admin-body").innerHTML = adminHtml(a);
}

applyLang();
async function boot() {
  const rideParam = new URLSearchParams(location.search).get("ride");
  if (rideParam) return showRide(rideParam);
  // Приглашение в совместную тренировку: t.me/<bot>?startapp=session_<token>.
  const start = tg && tg.initDataUnsafe.start_param;
  if (start && start.startsWith("session_")) {
    await loadMe();
    return showSession((await post(`/api/sessions/join/${encodeURIComponent(start.slice(8))}`)).id);
  }
  await showHome();
  if (me.rides[0] && me.rides[0].active) return showRide(me.rides[0].id);
  if (!localStorage.getItem("onboarded") && !me.rides.length) onboarding(true);
}
boot().catch(showError);
</script>
</body>
</html>
